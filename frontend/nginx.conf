# =============================================================================
# 📚 nginx.conf — 生产环境 Nginx 反向代理配置
# =============================================================================
#
# 【Docker 网络与 nginx 的关系】
#
# 在 docker-compose 中，每个服务（service）是一个独立的容器。
# Docker 会创建一个虚拟网络，容器之间通过"服务名"互相访问。
#
# 例如 docker-compose.prod.yml 中定义了两个服务：
#   backend:  运行 FastAPI 后端，监听 8000 端口
#   frontend: 运行 nginx，监听 80 端口
#
# 在 nginx 容器内部，可以直接用 "backend" 这个名字访问后端：
#   curl http://backend:8000/api/customers  ✅ 有效
#   curl http://localhost:8000              ❌ 无效（localhost 指向 nginx 自己）
#
# Docker 内部有一个 DNS 服务，自动将 "backend" 解析为后端容器的 IP
#
# =============================================================================

# ── 上游服务器定义 ──────────────────────────────────────────────────
# upstream: 定义一组后端服务器（这里只有一个）
# backend:8000 中的 "backend" 是 docker-compose 中的服务名
# 如果以后后端扩容为多个实例，可以在这里加更多 server
#
upstream backend {
    server backend:8000;
}

# ── 服务器块 ────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    # _: 通配符，接受任何域名/IP 的请求

    # ── Vue SPA 路由支持 ───────────────────────────────────────────
    # Vue Router 使用 HTML5 History 模式时，URL 看起来像 /about、/orders
    # 这些路径在服务器上并没有对应的文件，直接访问会 404
    # try_files: 先尝试找文件($uri)，再找目录($uri/)，都没有就返回 index.html
    # 这样 Vue Router 在浏览器端接管路由，正确渲染对应组件
    #
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 静态资源缓存 ──────────────────────────────────────────────
    # Vite 构建的 JS/CSS 文件名包含 hash（如 app.3a2b1c.js）
    # hash 变了说明内容变了，没变就是同一个文件
    # 所以带 hash 的文件可以永久缓存，大幅减少重复请求
    #
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API 反向代理 ──────────────────────────────────────────────
    # 【什么是反向代理？】
    # 浏览器请求 http://your-server/api/customers
    # nginx 收到后，将请求转发到 http://backend:8000/api/customers
    # 后端响应返回给 nginx，nginx 再返回给浏览器
    # 浏览器不知道后端的存在，只跟 nginx 通信 → 这就是"反向"代理
    #
    location /api/ {
        proxy_pass http://backend;
        # proxy_pass: 将请求转发到 upstream backend（即 backend:8000）

        # 传递客户端的真实信息给后端
        # 不加这些头，后端看到的 IP 永远是 nginx 的内网 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket 反向代理 ────────────────────────────────────────
    # WebSocket 与 HTTP 不同：它是持久连接，建立时需要 "升级" 握手
    #
    # 【WebSocket 升级过程】
    # 1. 浏览器发送 HTTP 请求，带上 Upgrade: websocket 头
    # 2. 服务器返回 101 Switching Protocols
    # 3. 之后连接从 HTTP 协议切换为 WebSocket 协议
    #
    # nginx 必须配置这些头才能正确转发 WebSocket：
    #
    location /ws/ {
        proxy_pass http://backend;

        # HTTP 版本必须是 1.1（HTTP/1.0 不支持长连接升级）
        proxy_http_version 1.1;

        # 告诉后端客户端想升级到 WebSocket 协议
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WebSocket 是长连接，需要较长的超时时间
        # 默认 60 秒超时会断开聊天连接
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
